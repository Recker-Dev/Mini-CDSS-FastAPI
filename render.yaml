services:
  # A Python web service
  - type: web
    name: mini-cdss-fastapi
    runtime: python
    plan: free
    autoDeploy: false
    # Uses uv for a fast, reproducible install from the lockfile (backend extra only).
    buildCommand: pip install uv && uv sync --frozen --no-dev --extra backend
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
